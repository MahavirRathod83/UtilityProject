<div class="sidebar" [class.close]="isSidebarClosed">
  <div class="logo-details">
    <span class="logo-text text-white ms-4">CodingLab</span>
    <div class="sidebar-toggle pe-4" (click)="toggleSidebar()">
      <i class="fa-solid fa-xmark"></i>
    </div>
  </div>
  <ul class="nav-links">
    <li *ngFor="let item of menuItems" [class.showMenu]="item.isOpen">
      <!-- With submenu -->
      <div class="iocn-link" *ngIf="item.submenu" (click)="toggleSubmenu(item)">
        <a>
          <i [class]="item.icon"></i>
          <span class="link_name">{{ item.name }}</span>
        </a>
        <i class="bx bxs-chevron-down arrow"></i>
      </div>

      <!-- Without submenu -->
      <a *ngIf="!item.submenu" [href]="item.link">
        <i [class]="item.icon"></i>
        <span class="link_name">{{ item.name }}</span>
      </a>

      <!-- Sub-menu -->
      <ul class="sub-menu" *ngIf="item.submenu">
        <li>
          <a class="link_name">{{ item.name }}</a>
        </li>
        <li *ngFor="let sub of item.submenu">
          <a [href]="sub.link">{{ sub.name }}</a>
        </li>
      </ul>
    </li>
  </ul>
</div>
